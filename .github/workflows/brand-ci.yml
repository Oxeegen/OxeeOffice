name: Brand checks

# Fast gate for every push and pull request on the OxeeOffice fork. Upstream's
# full CI (ci.yml) is guarded to run here only on demand; this keeps the
# fork-specific invariants checked on every change, in seconds:
#   - no enterprise-licensed code under ee/
#   - every brand hook in upstream files still in place

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: ee/ licence guard
        run: node brand/scripts/check-ee.mjs
      - name: Brand hooks intact
        run: node brand/scripts/check-hooks.mjs
